<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>YouTube Bulk Video Downloader</title>

  <link rel="icon" href="./static/res/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="static/css/style.css">
  <script type="module" src="static/js/main.js" defer></script>
</head>

<body>
<div class="container">
  <h2>YouTube Bulk Video Downloader</h2>

  <!-- Input area -->
  <div id="url-input">
    <input type="text" id="urlInput"
        placeholder="e.g. https://www.youtube.com/watch?v=XYZ123"/>
    <button id="addBtn">Add</button>
  </div>
  
  <div id="notifications"></div>
  
<!-- 
  <p>https://youtube.com/shorts/uq6bUOcq8MY?si=WPJoF5eJ9mi01ew8</p>
  <p>https://youtu.be/wJQXNdpCkwg?si=YDDvs0dX-7Oq2W_Y</p>
  <p>https://www.youtube.com/watch?v=b68HETiNO98</p>
  <p>https://www.youtube.com/watch?v=b68HETiNO98&list=PL4fGSI1pDJn4WX22qg1Po7qKOwOb4H6Sk</p>
  <p>https://youtube.com/playlist?list=PLZoTAELRMXVNKtpy0U_Mx9N26w8n0hIbs&si=GAFW9_Vi69mpGFdb</p> 
-->

  <div id="preferences">
    <h3>Default Quality Preferences</h3>
    <div class="preference-row">
      <div class="preference-group">
        <label for="defaultVideoQuality">Video Quality</label>
        <select id="defaultVideoQuality">
          <option value="best">Best Available</option>
          <option value="2160">2160p</option>
          <option value="1440">1440p</option>
          <option value="1080">1080p</option>
          <option value="720">720p</option>
          <option value="480">480p</option>
          <option value="360">360p</option>
          <option value="240">240p</option>
          <option value="144">144p</option>
        </select>
      </div>
      <div class="preference-group">
        <label for="defaultAudioQuality">Audio Quality</label>
        <select id="defaultAudioQuality">
          <option value="best">Best Available</option>
          <option value="160">160 kbps</option>
          <option value="128">128 kbps</option>
          <option value="96">96 kbps</option>
          <option value="64">64 kbps</option>
        </select>
      </div>
    </div>
  </div>

  <div id="video-list"></div>

  <div id="storage-estimate">
    <label><input type="checkbox" id="onlyAudio">Audio files only</label>
    <div id="storage-details"></div>
  </div>
  
  <div id="statusText" hidden></div>
  <div id="progressContainer" hidden>
      <div id="progressBar"></div>
  </div>
  <div id="progressText" hidden></div>

  <button id="proceedBtn">Proceed to download</button>

</div>
</body>
</html>
